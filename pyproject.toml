[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analog-discovery-pha"
version = "1.0.0"
description = "Pulse Height Analyzer for Analog Discovery 3"
authors = [{name = "Senior Architect", email = "architect@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "pyqtgraph>=0.13.3",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "h5py>=3.10.0"
]